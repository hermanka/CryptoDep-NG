services:
  cryptodep:
    build: .
    image: cryptodep-local:latest
    ports:
      - "127.0.0.1:${CRYPTODEP_PORT:-8088}:8000"
    environment:
      # Container clock shown in local time (log timestamps, worker). Override with TZ=<Area/City>.
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - cryptodep_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mock-ai:
    image: cryptodep-local:latest
    profiles: [mock]
    command: [uvicorn, cryptodep.web.mock_ai:app, --host, 0.0.0.0, --port, "8000", --workers, "1", --no-access-log]
    ports:
      - "127.0.0.1:${CRYPTODEP_MOCK_PORT:-8090}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 5s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cryptodep_data:
