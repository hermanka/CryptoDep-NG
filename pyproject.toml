[project]
name = "cryptodep-llm"
version = "1.0.0-alpha"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.25",
    "pydantic>=2.7",
    "tree-sitter>=0.22",
    "tree-sitter-java>=0.21",
    "tree-sitter-python>=0.21",
    "neo4j>=5.0",
    "networkx>=3.3",
    "cyclonedx-python-lib>=7.0",
    "typer>=0.12",
    "structlog>=24.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "setuptools>=68.0,<71.0",
    "ollama>=0.6.1",
    "tree-sitter-javascript>=0.23",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "semgrep>=1.70",
]

[project.scripts]
cryptodep = "cryptodep.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptodep"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
