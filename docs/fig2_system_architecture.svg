  <text x="165" y="246" text-anchor="middle" font-size="11" fill="#3b82f6">Semgrep (9 rules) + LLM (temp=0)</text>
  <text x="165" y="261" text-anchor="middle" font-size="10" fill="#6b7280">&#8594; validated_findings (prec &#8805; 0.85)</text>
  <text x="165" y="275" text-anchor="middle" font-size="10" fill="#94a3b8">async run(CDGState) &#8594; CDGState</text>
