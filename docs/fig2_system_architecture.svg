  <text x="165" y="346" text-anchor="middle" font-size="11" fill="#3b82f6">CoT LLM (temp=0.2, max_hop=4)</text>
  <text x="165" y="361" text-anchor="middle" font-size="10" fill="#6b7280">&#8594; validated_edges (&lt;15% hallucination)</text>
  <text x="165" y="375" text-anchor="middle" font-size="10" fill="#94a3b8">async run(CDGState) &#8594; CDGState</text>
